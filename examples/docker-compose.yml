services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Local/LAN beta example. For shared use, terminate TLS and set
      # N8N_PROTOCOL=https and N8N_SECURE_COOKIE=true.
      # Use a hostname/IP that every browser can reach, not localhost for LAN users.
      - EXTERNAL_FRONTEND_HOOKS_URLS=http://YOUR_HOST:8099/zip-ties-frontend.js?v=0.4.0-beta.6
      # Create a .env file with N8N_ENCRYPTION_KEY=$(openssl rand -hex 32).
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      - N8N_SECURE_COOKIE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n_data:/home/node/.n8n

  zip-ties-ui:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8099:80"
    volumes:
      - ../frontend:/usr/share/nginx/html:ro
      - ../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  n8n_data:
